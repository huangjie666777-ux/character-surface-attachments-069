<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>表面挂件演示</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #14181f; color: #dde; display: flex; height: 100vh; }
      #viewport { flex: 1; position: relative; }
      #viewport canvas { display: block; }
      #panel { width: 300px; padding: 12px; background: #1d2330; overflow-y: auto; font-size: 13px; }
      #panel h1 { font-size: 16px; margin: 0 0 8px; }
      #panel section { margin-bottom: 14px; }
      #panel button { margin: 2px 4px 2px 0; cursor: pointer; }
      #panel input[type="range"] { width: 100%; }
      #hint { min-height: 3em; color: #ffd27f; white-space: pre-wrap; }
      #attachments { list-style: none; padding: 0; margin: 6px 0; }
      #attachments button { width: 100%; text-align: left; background: #2a3242; color: #dde; border: 1px solid #3a4456; border-radius: 4px; padding: 4px 6px; }
      #attachments button.selected { background: #50422a; border-color: #ffc832; }
      #json { width: 100%; height: 120px; background: #12161f; color: #9fb; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="panel">
      <h1>表面挂件演示</h1>
      <section>
        <button id="play">暂停</button>
        <button id="restart">重新播放</button>
        <input id="time" type="range" min="0" max="1.2" step="0.01" value="0" />
      </section>
      <section>
        <div>挂件偏移（世界单位法向）</div>
        <input id="offset" type="range" min="-0.3" max="0.3" step="0.01" value="0.05" />
        <button id="delete">删除选中挂件</button>
      </section>
      <section>
        <div>挂件列表（点击选中）</div>
        <ul id="attachments"></ul>
      </section>
      <section>
        <button id="export">导出 JSON</button>
        <button id="import">从 JSON 加载</button>
        <textarea id="json" placeholder="导出的挂件 JSON，或粘贴后点击加载"></textarea>
      </section>
      <div id="hint"></div>
    </div>
    <script type="module" src="/page/main.ts"></script>
  </body>
</html>
